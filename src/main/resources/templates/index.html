<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon Family Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">

    <!-- CABEÇALHO COM ABAS DE NAVEGAÇÃO -->
    <header>
        <h1><i class="fa-solid fa-person-running"></i> Marathon Family Tracker</h1>
        <p>Acompanhamento de treino e saúde em família</p>

        <div class="tabs-nav">
            <button class="tab-btn active" id="btnTabCheckin" onclick="switchTab('checkin')">
                <i class="fa-solid fa-calendar-plus"></i> Novo Check-in
            </button>
            <button class="tab-btn" id="btnTabHistory" onclick="switchTab('history')">
                <i class="fa-solid fa-list-check"></i> Histórico
            </button>
            <button class="tab-btn" id="btnTabMembers" onclick="switchTab('members')">
                <i class="fa-solid fa-users-gear"></i> Gerenciar Pessoas
            </button>
        </div>
    </header>

    <!-- ABA 1: FORMULÁRIO DE CHECK-IN -->
    <div id="tabCheckin" class="tab-content active">
        <div class="card">
            <div class="card-title" id="formTitle"><i class="fa-solid fa-calendar-check"></i> Registrar Check-in Diário</div>
            
            <div class="edit-banner" id="editBanner">
                <span><i class="fa-solid fa-triangle-exclamation"></i> Você está editando um registro do histórico!</span>
                <button type="button" class="btn btn-cancel" onclick="resetCheckinForm()" style="padding:4px 8px; font-size:0.75rem;">Cancelar</button>
            </div>

            <form id="checkinForm" onsubmit="saveCheckin(event)">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Pessoa:</label>
                        <select id="userSelect" required></select>
                    </div>
                    <div class="form-group">
                        <label>Data:</label>
                        <input type="date" id="checkDate" required>
                    </div>
                    <div class="form-group">
                        <label>Horário:</label>
                        <input type="time" id="checkTime" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Exercício:</label>
                        <input type="text" id="exerciseType" placeholder="Ex: Corrida 5km, Funcional" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Como foi o treino?</label>
                        <textarea id="exerciseDetails" rows="2" placeholder="Sensações, intensidade, ritmo..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Alimentação:</label>
                        <input type="text" id="nutrition" placeholder="Ex: Dieta limpa, carbo regulado" required>
                    </div>
                    <div class="form-group">
                        <label>Consumo de Água (L):</label>
                        <input type="number" min="0" step="0.1" id="water" placeholder="Ex: 3.5" required>
                    </div>
                    <div class="form-group full-width" style="margin-top: 10px;">
                        <button type="submit" class="btn btn-primary" id="btnSubmitForm" style="width: 100%;">
                            <i class="fa-solid fa-check"></i> Salvar e Registrar Check-in
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- ABA 2: HISTÓRICO DE CHECK-INS -->
    <div id="tabHistory" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i> Histórico de Registros</div>
            <div class="filter-bar">
                <select id="filterUser" onchange="renderCheckins()" style="flex:1;">
                    <option value="ALL">Mostrar Todos da Família</option>
                </select>
            </div>
            <div class="checkin-list" id="checkinList"></div>
        </div>
    </div>

    <!-- ABA 3: ABA EXCLUSIVA PARA ADICIONAR E ALTERAR PESSOAS -->
    <div id="tabMembers" class="tab-content">
        <div class="card">
            <div class="card-title" id="memberFormTitle"><i class="fa-solid fa-user-plus"></i> Adicionar Nova Pessoa</div>
            <form id="memberForm" onsubmit="saveMember(event)">
                <input type="hidden" id="editMemberIndex" value="-1">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome:</label>
                        <input type="text" id="memberName" placeholder="Ex: Davi, Luana..." required>
                    </div>
                    <div class="form-group">
                        <label>WhatsApp (DDD + Número, opcional):</label>
                        <input type="tel" id="memberPhone" placeholder="Ex: 85999999999">
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" class="btn btn-primary" id="btnSaveMember">
                            <i class="fa-solid fa-plus"></i> Cadastrar Pessoa
                        </button>
                        <button type="button" class="btn btn-cancel" id="btnCancelMemberEdit" onclick="resetMemberForm()" style="display:none; margin-top:8px;">
                            Cancelar Edição
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <div class="card-title"><i class="fa-solid fa-users"></i> Pessoas Cadastradas</div>
            <div class="members-manage-list" id="membersManageList"></div>
        </div>
    </div>

</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>

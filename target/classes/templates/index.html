<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon Family Tracker</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --whatsapp: #25d366;
            --whatsapp-hover: #1eaa53;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 18px;
        }

        .tabs-nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #0f172a;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
        }

        .card-title i {
            color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select, textarea {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-whatsapp { background: var(--whatsapp); color: white; }
        .btn-whatsapp:hover { background: var(--whatsapp-hover); }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

        .btn-edit {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .btn-edit:hover { background: rgba(245, 158, 11, 0.3); }

        .btn-cancel { background: #475569; color: white; }

        .checkin-list, .members-manage-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkin-item, .member-manage-item {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .member-manage-item {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .checkin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .user-badge {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .checkin-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            font-size: 0.9rem;
        }

        .detail-box {
            background: rgba(255,255,255,0.02);
            padding: 8px;
            border-radius: 6px;
        }

        .detail-box span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .checkin-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .edit-banner {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            color: #fcd34d;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- CABEÇALHO COM ABAS DE NAVEGAÇÃO -->
    <header>
        <h1><i class="fa-solid fa-person-running"></i> Marathon Family Tracker</h1>
        <p>Acompanhamento de treino e saúde em família</p>

        <div class="tabs-nav">
            <button class="tab-btn active" id="btnTabCheckin" onclick="switchTab('checkin')">
                <i class="fa-solid fa-calendar-plus"></i> Novo Check-in
            </button>
            <button class="tab-btn" id="btnTabHistory" onclick="switchTab('history')">
                <i class="fa-solid fa-list-check"></i> Histórico
            </button>
            <button class="tab-btn" id="btnTabMembers" onclick="switchTab('members')">
                <i class="fa-solid fa-users-gear"></i> Gerenciar Pessoas
            </button>
        </div>
    </header>

    <!-- ABA 1: FORMULÁRIO DE CHECK-IN -->
    <div id="tabCheckin" class="tab-content active">
        <div class="card">
            <div class="card-title" id="formTitle"><i class="fa-solid fa-calendar-check"></i> Registrar Check-in Diário</div>
            
            <div class="edit-banner" id="editBanner">
                <span><i class="fa-solid fa-triangle-exclamation"></i> Você está editando um registro do histórico!</span>
                <button type="button" class="btn btn-cancel" onclick="resetCheckinForm()" style="padding:4px 8px; font-size:0.75rem;">Cancelar</button>
            </div>

            <form id="checkinForm" onsubmit="saveCheckin(event)">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Pessoa:</label>
                        <select id="userSelect" required></select>
                    </div>
                    <div class="form-group">
                        <label>Data:</label>
                        <input type="date" id="checkDate" required>
                    </div>
                    <div class="form-group">
                        <label>Horário:</label>
                        <input type="time" id="checkTime" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Exercício:</label>
                        <input type="text" id="exerciseType" placeholder="Ex: Corrida 5km, Funcional" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Como foi o treino?</label>
                        <textarea id="exerciseDetails" rows="2" placeholder="Sensações, intensidade, ritmo..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Alimentação:</label>
                        <input type="text" id="nutrition" placeholder="Ex: Dieta limpa, carbo regulado" required>
                    </div>
                    <div class="form-group">
                        <label>Consumo de Água (L):</label>
                        <input type="number" step="0.1" id="water" placeholder="Ex: 3.5" required>
                    </div>
                    <div class="form-group full-width" style="margin-top: 10px;">
                        <button type="submit" class="btn btn-primary" id="btnSubmitForm" style="width: 100%;">
                            <i class="fa-solid fa-check"></i> Salvar e Registrar Check-in
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- ABA 2: HISTÓRICO DE CHECK-INS -->
    <div id="tabHistory" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i> Histórico de Registros</div>
            <div class="filter-bar">
                <select id="filterUser" onchange="renderCheckins()" style="flex:1;">
                    <option value="ALL">Mostrar Todos da Família</option>
                </select>
            </div>
            <div class="checkin-list" id="checkinList"></div>
        </div>
    </div>

    <!-- ABA 3: GERENCIAR PESSOAS -->
    <div id="tabMembers" class="tab-content">
        <div class="card">
            <div class="card-title" id="memberFormTitle"><i class="fa-solid fa-user-plus"></i> Adicionar Nova Pessoa</div>
            <form id="memberForm" onsubmit="saveMember(event)">
                <input type="hidden" id="editMemberIndex" value="-1">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome:</label>
                        <input type="text" id="memberName" placeholder="Ex: Davi, Luana..." required>
                    </div>
                    <div class="form-group">
                        <label>WhatsApp (DDD + Número):</label>
                        <input type="tel" id="memberPhone" placeholder="Ex: 85999999999" required>
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" class="btn btn-primary" id="btnSaveMember">
                            <i class="fa-solid fa-plus"></i> Cadastrar Pessoa
                        </button>
                        <button type="button" class="btn btn-cancel" id="btnCancelMemberEdit" onclick="resetMemberForm()" style="display:none; margin-top:8px;">
                            Cancelar Edição
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <div class="card-title"><i class="fa-solid fa-users"></i> Pessoas Cadastradas</div>
            <div class="members-manage-list" id="membersManageList"></div>
        </div>
    </div>

</div>

<script>
    // CONFIGURAÇÃO DE CONEXÃO COM O SUPABASE
    const SUPABASE_URL = 'https://odvbxzecoyfgzhoyjyqt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kdmJ4emVjb3lmZ3pob3lqeXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTk1MzIsImV4cCI6MjEwODI3NTUzMn0.NDo1W6rK1dqBSTsyuGEOdvhXHhSNUn9P42sSPJKubq8';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // MEMÓRIA LOCAL DE BACKUP
    let members = JSON.parse(localStorage.getItem('mft_members')) || [
        { name: 'Davi', phone: '' },
        { name: 'Luana', phone: '' }
    ];

    let checkins = JSON.parse(localStorage.getItem('mft_checkins')) || [];

    document.addEventListener('DOMContentLoaded', () => {
        setDefaultDateTime();
        renderMembersOptions();
        renderMembersManageList();
        renderCheckins();
    });

    // GERENCIAMENTO DE ABAS
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

        if (tabName === 'checkin') {
            document.getElementById('btnTabCheckin').classList.add('active');
            document.getElementById('tabCheckin').classList.add('active');
        } else if (tabName === 'history') {
            document.getElementById('btnTabHistory').classList.add('active');
            document.getElementById('tabHistory').classList.add('active');
            renderCheckins();
        } else if (tabName === 'members') {
            document.getElementById('btnTabMembers').classList.add('active');
            document.getElementById('tabMembers').classList.add('active');
            renderMembersManageList();
        }
    }

    function setDefaultDateTime() {
        const now = new Date();
        document.getElementById('checkDate').value = now.toISOString().split('T')[0];
        document.getElementById('checkTime').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function saveData() {
        localStorage.setItem('mft_members', JSON.stringify(members));
        localStorage.setItem('mft_checkins', JSON.stringify(checkins));
    }

    // ABA 3: GERENCIAR INTEGRANTES
    function saveMember(e) {
        e.preventDefault();
        const name = document.getElementById('memberName').value.trim();
        const phone = document.getElementById('memberPhone').value.replace(/\D/g, '');
        const editIdx = parseInt(document.getElementById('editMemberIndex').value);

        if (editIdx === -1) {
            members.push({ name, phone });
        } else {
            const oldName = members[editIdx].name;
            members[editIdx] = { name, phone };
            checkins.forEach(c => {
                if (c.user === oldName) c.user = name;
            });
        }

        saveData();
        resetMemberForm();
        renderMembersOptions();
        renderMembersManageList();
    }

    function editMember(index) {
        const m = members[index];
        document.getElementById('memberName').value = m.name;
        document.getElementById('memberPhone').value = m.phone;
        document.getElementById('editMemberIndex').value = index;

        document.getElementById('memberFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Editar Pessoa';
        document.getElementById('btnSaveMember').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Atualizar Cadastro';
        document.getElementById('btnCancelMemberEdit').style.display = 'block';
    }

    function resetMemberForm() {
        document.getElementById('memberForm').reset();
        document.getElementById('editMemberIndex').value = '-1';
        document.getElementById('memberFormTitle').innerHTML = '<i class="fa-solid fa-user-plus"></i> Adicionar Nova Pessoa';
        document.getElementById('btnSaveMember').innerHTML = '<i class="fa-solid fa-plus"></i> Cadastrar Pessoa';
        document.getElementById('btnCancelMemberEdit').style.display = 'none';
    }

    function removeMember(index) {
        if (confirm(`Remover ${members[index].name}?`)) {
            members.splice(index, 1);
            saveData();
            renderMembersOptions();
            renderMembersManageList();
        }
    }

    function renderMembersOptions() {
        const userSelect = document.getElementById('userSelect');
        const filterUser = document.getElementById('filterUser');

        userSelect.innerHTML = '';
        const currentFilter = filterUser.value;
        filterUser.innerHTML = '<option value="ALL">Mostrar Todos da Família</option>';

        members.forEach(m => {
            userSelect.innerHTML += `<option value="${m.name}">${m.name}</option>`;
            filterUser.innerHTML += `<option value="${m.name}">Apenas ${m.name}</option>`;
        });

        filterUser.value = currentFilter || 'ALL';
    }

    function renderMembersManageList() {
        const list = document.getElementById('membersManageList');
        list.innerHTML = '';

        if (members.length === 0) {
            list.innerHTML = `<div class="empty-state"><p>Nenhuma pessoa cadastrada.</p></div>`;
            return;
        }

        members.forEach((m, idx) => {
            const item = document.createElement('div');
            item.className = 'member-manage-item';
            item.innerHTML = `
                <div>
                    <strong><i class="fa-solid fa-user"></i> ${m.name}</strong>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top:2px;">
                        WhatsApp: ${m.phone ? m.phone : 'Não informado'}
                    </p>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-edit" onclick="editMember(${idx})"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn btn-danger" onclick="removeMember(${idx})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            list.appendChild(item);
        });
    }

    // ABA 1 & 2: CHECK-IN & HISTÓRICO
    function saveCheckin(e) {
        e.preventDefault();
        const editIdx = parseInt(document.getElementById('editIndex').value);
        
        const data = {
            user: document.getElementById('userSelect').value,
            date: document.getElementById('checkDate').value,
            time: document.getElementById('checkTime').value,
            exercise: document.getElementById('exerciseType').value,
            details: document.getElementById('exerciseDetails').value,
            nutrition: document.getElementById('nutrition').value,
            water: document.getElementById('water').value
        };

        if (editIdx === -1) {
            checkins.unshift(data);
        } else {
            checkins[editIdx] = data;
        }

        saveData();
        resetCheckinForm();
        switchTab('history');
    }

    function resetCheckinForm() {
        document.getElementById('checkinForm').reset();
        document.getElementById('editIndex').value = '-1';
        document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-calendar-check"></i> Registrar Check-in Diário';
        document.getElementById('btnSubmitForm').innerHTML = '<i class="fa-solid fa-check"></i> Salvar e Registrar Check-in';
        document.getElementById('editBanner').style.display = 'none';
        setDefaultDateTime();
    }

    function editCheckin(index) {
        const item = checkins[index];
        document.getElementById('userSelect').value = item.user;
        document.getElementById('checkDate').value = item.date;
        document.getElementById('checkTime').value = item.time;
        document.getElementById('exerciseType').value = item.exercise;
        document.getElementById('exerciseDetails').value = item.details;
        document.getElementById('nutrition').value = item.nutrition;
        document.getElementById('water').value = item.water;

        document.getElementById('editIndex').value = index;
        document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Editar Check-in';
        document.getElementById('btnSubmitForm').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Atualizar Registro';
        document.getElementById('editBanner').style.display = 'flex';

        switchTab('checkin');
    }

    function deleteCheckin(index) {
        if (confirm('Excluir este registro?')) {
            checkins.splice(index, 1);
            saveData();
            renderCheckins();
        }
    }

    function sendWhatsApp(index) {
        const item = checkins[index];
        const member = members.find(m => m.name === item.user);
        
        let phone = member ? member.phone : '';
        if (!phone) {
            phone = prompt(`WhatsApp de ${item.user} (DDD + Número):`, '');
            if (!phone) return;
            phone = phone.replace(/\D/g, '');
        }

        const [year, month, day] = item.date.split('-');
        const dateFormatted = `${day}/${month}/${year}`;

        const msg = `🏃‍♂️ *CHECK-IN MARATONA - ${item.user.toUpperCase()}* 🏃‍♀️\n\n` +
                    `📅 *Data:* ${dateFormatted} às ${item.time}\n` +
                    `🏋️ *Treino:* ${item.exercise}\n` +
                    `📝 *Relato:* ${item.details}\n` +
                    `🥗 *Alimentação:* ${item.nutrition}\n` +
                    `💧 *Água:* ${item.water} Litros\n\n` +
                    `🚀 *Foco total na Maratona!*`;

        window.open(`https://wa.me/55${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function renderCheckins() {
        const listContainer = document.getElementById('checkinList');
        const filter = document.getElementById('filterUser').value;
        listContainer.innerHTML = '';

        const filtered = checkins.filter(item => filter === 'ALL' || item.user === filter);

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>Nenhum registro encontrado.</p></div>`;
            return;
        }

        filtered.forEach((item) => {
            const realIndex = checkins.indexOf(item);
            const [year, month, day] = item.date.split('-');
            const dateFormatted = `${day}/${month}/${year}`;

            const card = document.createElement('div');
            card.className = 'checkin-item';
            card.innerHTML = `
                <div class="checkin-header">
                    <span class="user-badge"><i class="fa-solid fa-user"></i> ${item.user}</span>
                    <span style="font-size:0.85rem; color: var(--text-muted);">
                        <i class="fa-regular fa-calendar"></i> ${dateFormatted} às ${item.time}
                    </span>
                </div>
                <div class="checkin-details">
                    <div class="detail-box"><span>EXERCÍCIO</span><strong>${item.exercise}</strong></div>
                    <div class="detail-box"><span>ALIMENTAÇÃO</span><strong>${item.nutrition}</strong></div>
                    <div class="detail-box"><span>ÁGUA</span><strong>${item.water} L</strong></div>
                </div>
                <div class="detail-box" style="margin-top:2px;">
                    <span>RELATO</span>
                    <p style="font-size:0.9rem; margin-top:2px;">${item.details}</p>
                </div>
                <div class="checkin-actions">
                    <button class="btn btn-whatsapp" onclick="sendWhatsApp(${realIndex})"><i class="fa-brands fa-whatsapp"></i> Mandar no Whats</button>
                    <button class="btn btn-edit" onclick="editCheckin(${realIndex})"><i class="fa-solid fa-pen"></i> Editar</button>
                    <button class="btn btn-danger" onclick="deleteCheckin(${realIndex})"><i class="fa-solid fa-trash"></i> Excluir</button>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }
</script>

</body>
</html>
